<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Leelawadee UI, Segoe UI, Noto Sans Thai, Noto Sans CJK SC, Noto Sans CJK JP, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- WIP202610029 language picker (2026-10-11 14:01 owner: "จะเปลี่ยนภาษา หรือเลือกทั้งหมด หรือ 2-3 ภาษา ยังไง").
       Two jobs, two controls: (1) "แสดง" = multi-select chips, which languages get an arrow / a table row;
       (2) the small language tag inside the input = which language you are typing in. Numbers are placeholders. -->
  <defs>
    <style>
      .bg{fill:#11161f}.panel{fill:#171d29;stroke:#2a3446}.canvas{fill:#151b26;stroke:#2a3446}
      .ink{fill:#e4e8f0}.mut{fill:#93a0b5}.line{stroke:#2a3446}
      .h1{font-size:20px;font-weight:700}.h2{font-size:14px;font-weight:700}.t{font-size:13px}.s{font-size:12px}.xs{font-size:11px}
      .off{fill:#1d2534;stroke:#2a3446}
      .en{stroke:#e46aae;fill:#e46aae}.th{stroke:#eab443;fill:#eab443}.zh{stroke:#4cc383;fill:#4cc383}.jp{stroke:#6a9dff;fill:#6a9dff}
      .note{fill:#ab8cff;font-size:12px}
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
    <!-- one mini canvas: axes + d1 -->
    <g id="axes">
      <line x1="0" y1="0" x2="110" y2="36" stroke="#ff6f61" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="0" y2="-110" stroke="#4cc383" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-104" y2="44" stroke="#6a9dff" stroke-width="1.5"/>
      <circle cx="-6" cy="-88" r="5" fill="#ab8cff"/><text x="2" y="-92" fill="#ab8cff" class="xs" font-weight="700">d1</text>
      <circle cx="34" cy="-74" r="5" fill="#ab8cff"/><text x="42" y="-78" fill="#ab8cff" class="xs" font-weight="700">d5</text>
    </g>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text x="32" y="40" class="ink h1">เลือกภาษา: 1 ภาษา · 2–3 ภาษา · ทั้งหมด</text>
  <text x="32" y="64" class="mut t">ปุ่ม "แสดง" เลือกได้หลายภาษา (กดเปิด / ปิดทีละปุ่ม) · ป้ายเล็กในช่องพิมพ์บอกว่ากำลังพิมพ์ภาษาไหน</text>

  <!-- ====================== state A: one language ====================== -->
  <g transform="translate(32,88)">
    <rect class="panel" width="360" height="500" rx="10"/>
    <text x="16" y="28" class="ink h2">A · ภาษาเดียว (ค่าเริ่มต้น = EN)</text>
    <!-- chips -->
    <text x="16" y="56" class="mut s">แสดง</text>
    <g class="s">
      <rect x="56" y="40" width="58" height="26" rx="13" class="off"/><text x="85" y="58" class="mut" text-anchor="middle">ทั้งหมด</text>
      <rect x="120" y="40" width="46" height="26" rx="13" fill="#e46aae33" stroke="#e46aae"/><circle cx="132" cy="53" r="4" class="en"/><text x="150" y="58" class="ink" text-anchor="middle" font-weight="700">EN</text>
      <rect x="172" y="40" width="46" height="26" rx="13" class="off"/><text x="195" y="58" class="mut" text-anchor="middle">TH</text>
      <rect x="224" y="40" width="50" height="26" rx="13" class="off"/><text x="249" y="58" class="mut" text-anchor="middle">中文</text>
      <rect x="280" y="40" width="64" height="26" rx="13" class="off"/><text x="312" y="58" class="mut" text-anchor="middle">日本語</text>
    </g>
    <!-- mini canvas -->
    <rect class="canvas" x="16" y="80" width="328" height="180" rx="8"/>
    <g transform="translate(180,196)">
      <use href="#axes"/>
      <line x1="0" y1="0" x2="56" y2="-64" class="en" stroke-width="3" marker-end="url(#ar)"/>
    </g>
    <text x="336" y="252" class="mut xs" text-anchor="end">1 ลูกศร</text>
    <!-- input with language tag -->
    <rect x="16" y="274" width="328" height="38" rx="6" fill="#151b26" stroke="#2a3446"/>
    <rect x="22" y="281" width="42" height="24" rx="5" fill="#e46aae33" stroke="#e46aae"/><text x="43" y="298" class="ink s" text-anchor="middle" font-weight="700">EN ▾</text>
    <text x="74" y="298" class="ink t">my pet is hungry</text>
    <!-- table -->
    <g class="s">
      <text x="16" y="340" class="mut" font-weight="700">ภาษา</text><text x="96" y="340" class="mut" font-weight="700">อันดับ 1</text><text x="176" y="340" class="mut" font-weight="700">cos</text><text x="240" y="340" class="mut" font-weight="700">ถูก?</text>
      <line x1="16" y1="348" x2="344" y2="348" class="line"/>
      <circle cx="20" cy="364" r="4" class="en"/><text x="30" y="368" class="ink">EN</text><text x="96" y="368" class="ink">d1</text><text x="176" y="368" class="ink">0.98</text><text x="240" y="368" fill="#4cc383">✓</text>
    </g>
    <text x="16" y="414" class="note">ค่าเริ่มต้นตอนเปิดบท: EN อย่างเดียว</text>
    <text x="16" y="436" class="mut s">ภาษาที่พิมพ์ = ภาษาที่แสดง</text>
    <text x="16" y="458" class="mut s">ตาราง 1 แถว · ภาพไม่รก · กด TH / 中文 / 日本語 เพิ่มได้</text>
  </g>

  <!-- ====================== state B: two or three languages ====================== -->
  <g transform="translate(420,88)">
    <rect class="panel" width="360" height="500" rx="10"/>
    <text x="16" y="28" class="ink h2">B · 2–3 ภาษา (เช่น EN + TH)</text>
    <text x="16" y="56" class="mut s">แสดง</text>
    <g class="s">
      <rect x="56" y="40" width="58" height="26" rx="13" class="off"/><text x="85" y="58" class="mut" text-anchor="middle">ทั้งหมด</text>
      <rect x="120" y="40" width="46" height="26" rx="13" fill="#e46aae33" stroke="#e46aae"/><circle cx="132" cy="53" r="4" class="en"/><text x="150" y="58" class="ink" text-anchor="middle" font-weight="700">EN</text>
      <rect x="172" y="40" width="46" height="26" rx="13" fill="#eab44333" stroke="#eab443"/><circle cx="184" cy="53" r="4" class="th"/><text x="202" y="58" class="ink" text-anchor="middle" font-weight="700">TH</text>
      <rect x="224" y="40" width="50" height="26" rx="13" class="off"/><text x="249" y="58" class="mut" text-anchor="middle">中文</text>
      <rect x="280" y="40" width="64" height="26" rx="13" class="off"/><text x="312" y="58" class="mut" text-anchor="middle">日本語</text>
    </g>
    <rect class="canvas" x="16" y="80" width="328" height="180" rx="8"/>
    <g transform="translate(180,196)">
      <use href="#axes"/>
      <line x1="0" y1="0" x2="58" y2="-62" class="en" stroke-width="3" marker-end="url(#ar)"/>
      <line x1="0" y1="0" x2="54" y2="-66" class="th" stroke-width="3" marker-end="url(#ar)" stroke-dasharray="7 5"/>
    </g>
    <text x="336" y="252" class="mut xs" text-anchor="end">2 ลูกศรทับกัน = ความหมายเดียวกัน</text>
    <rect x="16" y="274" width="328" height="38" rx="6" fill="#151b26" stroke="#2a3446"/>
    <rect x="22" y="281" width="42" height="24" rx="5" fill="#eab44333" stroke="#eab443"/><text x="43" y="298" class="ink s" text-anchor="middle" font-weight="700">TH ▾</text>
    <text x="74" y="298" class="ink t">สัตว์เลี้ยงของฉันหิว</text>
    <g class="s">
      <text x="16" y="340" class="mut" font-weight="700">ภาษา</text><text x="96" y="340" class="mut" font-weight="700">อันดับ 1</text><text x="176" y="340" class="mut" font-weight="700">cos</text><text x="240" y="340" class="mut" font-weight="700">ถูก?</text>
      <line x1="16" y1="348" x2="344" y2="348" class="line"/>
      <circle cx="20" cy="364" r="4" class="en"/><text x="30" y="368" class="ink">EN</text><text x="96" y="368" class="ink">d1</text><text x="176" y="368" class="ink">0.98</text><text x="240" y="368" fill="#4cc383">✓</text>
      <rect x="12" y="376" width="336" height="22" rx="4" fill="#eab44314"/>
      <circle cx="20" cy="388" r="4" class="th"/><text x="30" y="392" class="ink" font-weight="700">TH</text><text x="96" y="392" class="ink" font-weight="700">d1</text><text x="176" y="392" class="ink" font-weight="700">0.98</text><text x="240" y="392" fill="#4cc383">✓</text>
    </g>
    <text x="16" y="430" class="note">กดชิปเพื่อเปิด / ปิดทีละภาษา</text>
    <text x="16" y="452" class="mut s">แถวที่ไฮไลต์ = ภาษาที่กำลังพิมพ์ (TH ▾)</text>
    <text x="16" y="474" class="mut s">ภาษาอื่นใช้ประโยคแปลของปุ่มตัวอย่าง</text>
  </g>

  <!-- ====================== state C: all four ====================== -->
  <g transform="translate(808,88)">
    <rect class="panel" width="360" height="500" rx="10"/>
    <text x="16" y="28" class="ink h2">C · ทั้งหมด</text>
    <text x="16" y="56" class="mut s">แสดง</text>
    <g class="s">
      <rect x="56" y="40" width="58" height="26" rx="13" fill="#e4e8f0"/><text x="85" y="58" fill="#171d29" text-anchor="middle" font-weight="700">ทั้งหมด</text>
      <rect x="120" y="40" width="46" height="26" rx="13" fill="#e46aae33" stroke="#e46aae"/><circle cx="132" cy="53" r="4" class="en"/><text x="150" y="58" class="ink" text-anchor="middle" font-weight="700">EN</text>
      <rect x="172" y="40" width="46" height="26" rx="13" fill="#eab44333" stroke="#eab443"/><circle cx="184" cy="53" r="4" class="th"/><text x="202" y="58" class="ink" text-anchor="middle" font-weight="700">TH</text>
      <rect x="224" y="40" width="50" height="26" rx="13" fill="#4cc38333" stroke="#4cc383"/><circle cx="236" cy="53" r="4" class="zh"/><text x="255" y="58" class="ink" text-anchor="middle" font-weight="700">中文</text>
      <rect x="280" y="40" width="64" height="26" rx="13" fill="#6a9dff33" stroke="#6a9dff"/><circle cx="292" cy="53" r="4" class="jp"/><text x="318" y="58" class="ink" text-anchor="middle" font-weight="700">日本語</text>
    </g>
    <rect class="canvas" x="16" y="80" width="328" height="180" rx="8"/>
    <g transform="translate(180,196)">
      <use href="#axes"/>
      <line x1="0" y1="0" x2="58" y2="-62" class="en" stroke-width="3" marker-end="url(#ar)"/>
      <line x1="0" y1="0" x2="54" y2="-66" class="th" stroke-width="3" marker-end="url(#ar)" stroke-dasharray="7 5"/>
      <line x1="0" y1="0" x2="60" y2="-60" class="zh" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="3 5"/>
      <line x1="0" y1="0" x2="40" y2="-72" class="jp" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="1 4"/>
    </g>
    <text x="336" y="252" class="mut xs" text-anchor="end">日本語 เอียงไปทาง d5 = ตัวอย่างที่พลาด</text>
    <rect x="16" y="274" width="328" height="38" rx="6" fill="#151b26" stroke="#2a3446"/>
    <rect x="22" y="281" width="42" height="24" rx="5" fill="#eab44333" stroke="#eab443"/><text x="43" y="298" class="ink s" text-anchor="middle" font-weight="700">TH ▾</text>
    <text x="74" y="298" class="ink t">สัตว์เลี้ยงของฉันหิว</text>
    <g class="s">
      <text x="16" y="340" class="mut" font-weight="700">ภาษา</text><text x="96" y="340" class="mut" font-weight="700">อันดับ 1</text><text x="176" y="340" class="mut" font-weight="700">cos</text><text x="240" y="340" class="mut" font-weight="700">ถูก?</text>
      <line x1="16" y1="348" x2="344" y2="348" class="line"/>
      <circle cx="20" cy="364" r="4" class="en"/><text x="30" y="368" class="ink">EN</text><text x="96" y="368" class="ink">d1</text><text x="176" y="368" class="ink">0.98</text><text x="240" y="368" fill="#4cc383">✓</text>
      <rect x="12" y="376" width="336" height="22" rx="4" fill="#eab44314"/>
      <circle cx="20" cy="388" r="4" class="th"/><text x="30" y="392" class="ink" font-weight="700">TH</text><text x="96" y="392" class="ink" font-weight="700">d1</text><text x="176" y="392" class="ink" font-weight="700">0.98</text><text x="240" y="392" fill="#4cc383">✓</text>
      <circle cx="20" cy="412" r="4" class="zh"/><text x="30" y="416" class="ink">中文</text><text x="96" y="416" class="ink">d1</text><text x="176" y="416" class="ink">0.98</text><text x="240" y="416" fill="#4cc383">✓</text>
      <circle cx="20" cy="436" r="4" class="jp"/><text x="30" y="440" class="ink">日本語</text><text x="96" y="440" class="ink">d5</text><text x="176" y="440" class="ink">0.91</text><text x="240" y="440" fill="#ff6f61">✗</text>
    </g>
    <text x="16" y="472" class="note">"ทั้งหมด" = เปิดครบ 4 · กดอีกครั้ง = กลับเหลือภาษาที่พิมพ์</text>
  </g>

  <text x="32" y="608" class="mut xs">กติกา: ค่าเริ่มต้น EN (owner 2026-10-11 14:03) · ต้องเปิดอย่างน้อย 1 ภาษา · เปลี่ยนภาษาที่พิมพ์ (TH ▾) = ภาษานั้นถูกเปิดให้อัตโนมัติ · ปุ่มตัวอย่างเติมประโยคครบ 4 ภาษาพร้อมกัน · ตัวเลขเป็นตัวสมมติ</text>
</svg>
